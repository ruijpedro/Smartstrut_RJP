name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build WebApp
        run: npm run build
      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply SmartStruct Android icon
        run: |
          echo "Applying SmartStruct_RJP launcher icon..."
          cp -R android-icon-res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartStruct_RJP_V52_debug_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
